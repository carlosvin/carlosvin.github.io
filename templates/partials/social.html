<span class="social-links">
  {% for social in config.extra.social_links %}
  <a href="{{ social.url }}" target="_blank" rel="noopener">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/{{ social.icon }}.svg" alt="{{ social.name }}"
      width="32" height="32">
  </a>
  {% endfor %}
  <a href="{{ get_url(path='atom.xml') }}">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/rss.svg" alt="RSS" width="32" height="32">
  </a>
</span>
