<ul>
  {% for social in config.extra.social_links %}
  <li>
    <a href="{% if social.path %}{{ get_url(path=social.path) }}{% else %}{{ social.url }}{% endif %}"
      {% if social.url %}target="_blank" rel="noopener"{% endif %}>
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/{{ social.icon }}.svg" alt="{{ social.name }}"
        width="32" height="32">
    </a>
  </li>
  {% endfor %}
</ul>
