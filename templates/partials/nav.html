<nav>
  <ul>
    <li>
      <a class="brand" href="{{ get_url(path='') }}">
        <img src="{{ get_url(path='img/android-chrome-192x192.png') }}" alt="" width="32" height="32">
        <span>{{ config.title }}</span>
      </a>
    </li>
  </ul>
  <ul>
    {% for section in config.extra.nav_sections %}
    <li><a href="{{ get_url(path=section.path) }}">{{ section.title }}</a></li>
    {% endfor %}
    <li><a href="{{ get_url(path='tags') }}">Tags</a></li>
    <li>
      <label>
        Dark
        <input type="checkbox" data-toggle-theme="dark,light" role="switch" aria-label="Dark mode">
      </label>
    </li>
    <li>
      <input id="search" type="search" placeholder="Search posts" aria-label="Search posts"
        autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="search-results"
        aria-expanded="false" title="Press / to search">
      <div id="search-results" hidden>
        <p role="status" aria-live="polite"></p>
        <ul role="listbox" aria-label="Search results"></ul>
      </div>
    </li>
  </ul>
</nav>
