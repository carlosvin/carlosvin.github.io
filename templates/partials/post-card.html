<article>
    {% set link_to_post = true %}
    {% include "partials/preview-img.html" %}
    <header>
        <h3><a href="{{ page.permalink | safe }}">{{ page.title }}</a></h3>
        {% include "partials/post-meta.html" %}
    </header>
    <p>{{ page.description | default(value=page.summary) }}</p>
    {% if page.taxonomies.tags %}
    <footer>
        {% set max_tags = 4 %}
        {% include "partials/post-tags.html" %}
    </footer>
    {% endif %}
</article>
