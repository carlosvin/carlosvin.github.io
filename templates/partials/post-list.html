<div class="blog">
    {% if post_list is defined %}
    {% set pages = post_list %}
    {% elif section is defined %}
    {% set pages = section.pages %}
    {% else %}
    {% set pages = [] %}
    {% endif %}
    {% for page in pages %}
    {% if not page.extra.unlisted %}
    {% include "partials/post-card.html" %}
    {% endif %}
    {% endfor %}
</div>
