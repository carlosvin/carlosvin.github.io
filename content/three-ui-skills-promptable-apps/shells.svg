<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Three prompt experiences on one deployment</title>
  <desc id="desc">Side by side wireframes of Promptable UI with a hidden side panel, a prompt-first page with a pinned composer, and an agentic shell whose only view comes from a tool result.</desc>
  <rect width="1400" height="780" fill="#101410"/>
  <text x="48" y="58" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="28" font-weight="650">One deployment, one experience</text>
  <text x="48" y="92" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="16">PROMPT_CONCEPT selects the shell. The server functions underneath stay the same.</text>

  <!-- SIDE -->
  <g transform="translate(40,130)">
    <rect width="420" height="560" rx="16" fill="#171c18" stroke="#2c382c"/>
    <text x="24" y="40" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="650" letter-spacing="0.08em">PROMPT_CONCEPT=side</text>
    <text x="24" y="72" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="650">Promptable UI (side)</text>
    <text x="24" y="100" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Skill: promptable-ux</text>
    <g transform="translate(24,124)">
      <rect width="372" height="360" rx="10" fill="#101410" stroke="#2c382c"/>
      <rect x="12" y="12" width="348" height="36" rx="6" fill="#1e2620"/>
      <text x="24" y="35" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Tasks</text>
      <rect x="250" y="20" width="96" height="20" rx="10" fill="#243024" stroke="#c6f135"/>
      <text x="264" y="34" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="11">Open AI</text>
      <rect x="12" y="60" width="70" height="14" rx="4" fill="#243024"/>
      <rect x="90" y="60" width="70" height="14" rx="4" fill="#243024"/>
      <rect x="168" y="60" width="90" height="14" rx="4" fill="#243024"/>
      <rect x="12" y="90" width="210" height="22" rx="4" fill="#1e2620"/>
      <rect x="12" y="122" width="210" height="22" rx="4" fill="#1a201b"/>
      <rect x="12" y="154" width="210" height="22" rx="4" fill="#1e2620"/>
      <rect x="12" y="186" width="210" height="22" rx="4" fill="#1a201b"/>
      <rect x="12" y="218" width="210" height="22" rx="4" fill="#1e2620"/>
      <rect x="236" y="90" width="124" height="220" rx="8" fill="#1e2620" stroke="#c6f135"/>
      <text x="248" y="114" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Chat</text>
      <text x="248" y="136" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="11">Closed until</text>
      <text x="248" y="152" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="11">the user asks.</text>
      <rect x="248" y="270" width="100" height="24" rx="6" fill="#101410" stroke="#2c382c"/>
    </g>
    <text x="24" y="520" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="15">The list is the product.</text>
    <text x="24" y="542" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="14">The prompt assists the screen already open.</text>
  </g>

  <!-- PROMPT FIRST -->
  <g transform="translate(490,130)">
    <rect width="420" height="560" rx="16" fill="#171c18" stroke="#2c382c"/>
    <text x="24" y="40" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="650" letter-spacing="0.08em">PROMPT_CONCEPT=prompt-first</text>
    <text x="24" y="72" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="650">Prompt-first</text>
    <text x="24" y="100" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Skill: promptable-ux</text>
    <g transform="translate(24,124)">
      <rect width="372" height="360" rx="10" fill="#101410" stroke="#2c382c"/>
      <rect x="12" y="12" width="348" height="36" rx="6" fill="#1e2620"/>
      <text x="24" y="35" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Home / Tasks</text>
      <text x="28" y="86" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="16">What should we look at?</text>
      <rect x="24" y="104" width="120" height="26" rx="13" fill="#243024" stroke="#c6f135"/>
      <text x="36" y="122" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Open tasks</text>
      <rect x="152" y="104" width="130" height="26" rx="13" fill="#243024" stroke="#2c382c"/>
      <text x="164" y="122" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="12">High priority</text>
      <rect x="24" y="160" width="250" height="48" rx="8" fill="#1e2620"/>
      <text x="36" y="188" fill="#d5ddd4" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Three tasks are blocked.</text>
      <rect x="24" y="220" width="200" height="36" rx="8" fill="#243024" stroke="#2c382c"/>
      <text x="36" y="242" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="13">View tasks</text>
      <rect x="12" y="300" width="348" height="48" rx="8" fill="#1e2620" stroke="#c6f135"/>
      <text x="24" y="329" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Ask about this view...</text>
    </g>
    <text x="24" y="520" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="15">The prompt is the front door.</text>
    <text x="24" y="542" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Drill-down still lands on a real route.</text>
  </g>

  <!-- AGENTIC -->
  <g transform="translate(940,130)">
    <rect width="420" height="560" rx="16" fill="#171c18" stroke="#c6f135"/>
    <text x="24" y="40" fill="#c6f135" font-family="Inter, Liberation Sans, sans-serif" font-size="13" font-weight="650" letter-spacing="0.08em">PROMPT_CONCEPT=agentic</text>
    <text x="24" y="72" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="22" font-weight="650">Agentic shell</text>
    <text x="24" y="100" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Skill: agentic-ux</text>
    <g transform="translate(24,124)">
      <rect width="372" height="360" rx="10" fill="#101410" stroke="#2c382c"/>
      <rect x="12" y="12" width="348" height="36" rx="6" fill="#1e2620"/>
      <text x="24" y="35" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="13">TaskHub</text>
      <text x="300" y="35" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="12">identity</text>
      <text x="24" y="78" fill="#d5ddd4" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Here are the open tasks.</text>
      <text x="24" y="100" fill="#8fb82a" font-family="Inter, Liberation Sans, sans-serif" font-size="12">showing tasks</text>
      <rect x="24" y="116" width="324" height="64" rx="8" fill="#1e2620" stroke="#2c382c"/>
      <text x="36" y="142" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Renew the contract</text>
      <text x="36" y="162" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="12">High / In progress</text>
      <rect x="24" y="190" width="324" height="64" rx="8" fill="#1e2620" stroke="#2c382c"/>
      <text x="36" y="216" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="14">Prepare the Q3 review</text>
      <text x="36" y="236" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="12">Medium / Open</text>
      <rect x="12" y="300" width="348" height="48" rx="8" fill="#1e2620" stroke="#c6f135"/>
      <text x="24" y="329" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="13">Show my tasks...</text>
    </g>
    <text x="24" y="520" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="15">The tool result is the screen.</text>
    <text x="24" y="542" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="14">There is no app navigation to maintain.</text>
  </g>
</svg>
