<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Agentic view rendering</title>
  <desc id="desc">A tool returns data. A closed UI catalog becomes an allowlisted A2UI surface in the host. A raw HTML document renders inside a sandboxed iframe. The host page never injects model HTML.</desc>
  <rect width="1400" height="720" fill="#101410"/>
  <text x="48" y="56" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="28" font-weight="650">The model returns data. The host draws the view.</text>
  <text x="48" y="90" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="16">Two renderers. One rule: untrusted markup stays outside the host document.</text>

  <g font-family="Inter, Liberation Sans, sans-serif">
    <rect x="500" y="124" width="400" height="72" rx="12" fill="#171c18" stroke="#c6f135"/>
    <text x="700" y="166" text-anchor="middle" fill="#f3f6ef" font-size="18" font-weight="650">Tool result / data only</text>

    <path d="M620 196 V236 H360 V260" fill="none" stroke="#8fb82a" stroke-width="2"/>
    <path d="M780 196 V236 H1040 V260" fill="none" stroke="#8fb82a" stroke-width="2"/>

    <rect x="48" y="260" width="620" height="300" rx="14" fill="#171c18" stroke="#2c382c"/>
    <text x="72" y="298" fill="#c6f135" font-size="13" font-weight="650" letter-spacing="0.06em">CLOSED CATALOG / MANTINE</text>
    <text x="72" y="334" fill="#f3f6ef" font-size="20" font-weight="650">A2UI surface in the host</text>
    <text x="72" y="370" fill="#d5ddd4" font-size="15">buildTaskViewMessages, acceptA2uiMessages, Surface</text>
    <text x="72" y="408" fill="#a3b0a3" font-size="15">Allowlist: Column, Row, Card, Text, Title,</text>
    <text x="72" y="432" fill="#a3b0a3" font-size="15">Badge, Button, and the table nodes.</text>
    <text x="72" y="470" fill="#f3f6ef" font-size="15">An unknown component type draws nothing.</text>
    <text x="72" y="506" fill="#a3b0a3" font-size="15">open-task with one id opens detail locally.</text>
    <text x="72" y="534" fill="#a3b0a3" font-size="15">That click spends no extra model turn.</text>

    <rect x="732" y="260" width="620" height="300" rx="14" fill="#171c18" stroke="#2c382c"/>
    <text x="756" y="298" fill="#c6f135" font-size="13" font-weight="650" letter-spacing="0.06em">RAW DOCUMENT</text>
    <text x="756" y="334" fill="#f3f6ef" font-size="20" font-weight="650">MCP UI in a sandbox</text>
    <text x="756" y="370" fill="#d5ddd4" font-size="15">ui:// resource, AppRenderer, sandbox proxy</text>
    <text x="756" y="408" fill="#a3b0a3" font-size="15">Guest HTML sits in an inner iframe.</text>
    <text x="756" y="432" fill="#a3b0a3" font-size="15">The proxy withholds allow-same-origin.</text>
    <text x="756" y="470" fill="#f3f6ef" font-size="15">Links: http, https, mailto.</text>
    <text x="756" y="506" fill="#a3b0a3" font-size="15">The widget sends a follow-up prompt.</text>
    <text x="756" y="534" fill="#a3b0a3" font-size="15">Direct tool calls from the frame are refused.</text>

    <rect x="48" y="590" width="1304" height="84" rx="12" fill="#1e2620" stroke="#c6f135"/>
    <text x="72" y="628" fill="#f3f6ef" font-size="18" font-weight="650">Host document</text>
    <text x="72" y="654" fill="#a3b0a3" font-size="15">Renders allowlisted A2UI nodes only. Tool or model HTML is never injected into this page.</text>
  </g>
</svg>
