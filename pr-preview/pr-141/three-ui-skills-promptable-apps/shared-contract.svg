<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">Shared runtime under three prompt shells</title>
  <desc id="desc">Three shells sit on one chat endpoint, one auth ticket, and the same server functions. Route-based shells may navigate. The agentic shell re-renders from tool results.</desc>
  <rect width="1400" height="640" fill="#101410"/>
  <text x="48" y="56" fill="#f3f6ef" font-family="Inter, Liberation Sans, sans-serif" font-size="28" font-weight="650">Chrome moves. The contract stays.</text>
  <text x="48" y="90" fill="#a3b0a3" font-family="Inter, Liberation Sans, sans-serif" font-size="16">Authorization, schemas, and server functions are inherited from the architecture skill.</text>

  <g font-family="Inter, Liberation Sans, sans-serif">
    <rect x="48" y="130" width="300" height="88" rx="12" fill="#171c18" stroke="#c6f135"/>
    <text x="68" y="164" fill="#f3f6ef" font-size="16" font-weight="650">Side panel</text>
    <text x="68" y="190" fill="#a3b0a3" font-size="13">Domain route is primary</text>

    <rect x="372" y="130" width="300" height="88" rx="12" fill="#171c18" stroke="#c6f135"/>
    <text x="392" y="164" fill="#f3f6ef" font-size="16" font-weight="650">Prompt-first</text>
    <text x="392" y="190" fill="#a3b0a3" font-size="13">Prompt, then a real route</text>

    <rect x="696" y="130" width="300" height="88" rx="12" fill="#171c18" stroke="#c6f135"/>
    <text x="716" y="164" fill="#f3f6ef" font-size="16" font-weight="650">Agentic shell</text>
    <text x="716" y="190" fill="#a3b0a3" font-size="13">Tool view is the screen</text>

    <path d="M198 218 V252 H846" fill="none" stroke="#8fb82a" stroke-width="2"/>
    <path d="M522 218 V252" fill="none" stroke="#8fb82a" stroke-width="2"/>
    <path d="M846 218 V252" fill="none" stroke="#8fb82a" stroke-width="2"/>
    <path d="M698 252 V278" fill="none" stroke="#8fb82a" stroke-width="2"/>

    <rect x="248" y="278" width="900" height="120" rx="12" fill="#171c18" stroke="#2c382c"/>
    <text x="272" y="314" fill="#c6f135" font-size="13" font-weight="650" letter-spacing="0.06em">ONE PROMPT STACK</text>
    <text x="272" y="346" fill="#f3f6ef" font-size="18">POST /api/chat / system prompt / browser context / maxIterations</text>
    <text x="272" y="374" fill="#a3b0a3" font-size="15">Mounted only when getAIAvailability() is true. Thread state lives on the root layout.</text>

    <path d="M698 398 V430" fill="none" stroke="#8fb82a" stroke-width="2"/>

    <rect x="248" y="430" width="430" height="150" rx="12" fill="#171c18" stroke="#2c382c"/>
    <text x="272" y="466" fill="#c6f135" font-size="13" font-weight="650" letter-spacing="0.06em">ROUTE-BASED SHELLS</text>
    <text x="272" y="500" fill="#f3f6ef" font-size="16">navigate / invalidateRouter</text>
    <text x="272" y="528" fill="#a3b0a3" font-size="14">Navigation manifest from the router.</text>
    <text x="272" y="552" fill="#a3b0a3" font-size="14">Overview and detail share loaders.</text>

    <rect x="718" y="430" width="430" height="150" rx="12" fill="#171c18" stroke="#2c382c"/>
    <text x="742" y="466" fill="#c6f135" font-size="13" font-weight="650" letter-spacing="0.06em">AGENTIC SHELL</text>
    <text x="742" y="500" fill="#f3f6ef" font-size="16">Re-render from the tool result</text>
    <text x="742" y="528" fill="#a3b0a3" font-size="14">No in-app routes to open.</text>
    <text x="742" y="552" fill="#a3b0a3" font-size="14">Writes still carry the auth ticket.</text>
  </g>
</svg>
