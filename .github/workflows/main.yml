on: push
jobs:
  e2e:
    name: golden-flow e2e
    runs-on: ubuntu-latest
    steps:
      - name: 'checkout'
        uses: actions/checkout@v7.0.1
      - name: 'install zola'
        run: |
          set -euo pipefail
          ZOLA_VERSION="v0.23.3"
          curl -fsSL --retry 5 --retry-delay 2 \
            "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          sudo install -m 0755 zola /usr/local/bin/zola
          zola --version
      - name: 'setup node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 'install npm deps'
        run: npm ci
      - name: 'install playwright chromium'
        run: npx playwright install --with-deps chromium
      - name: 'run golden-flow e2e'
        run: npx playwright test
      - name: 'upload playwright report'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: 'checkout'
        uses: actions/checkout@v7.0.1
      - name: 'build'
        uses: shalzz/zola-deploy-action@v0.23.3
        env:
          PAGES_BRANCH: pages
          BUILD_DIR: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ONLY: true
  build_and_deploy:
    needs: e2e
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 'checkout'
        uses: actions/checkout@v7.0.1
      - name: 'build'
        uses: shalzz/zola-deploy-action@v0.23.3
        env:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ONLY: true
      - name: 'deploy'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          # Keep live PR preview sites under /pr-preview/; do not force-push.
          clean-exclude: pr-preview/
          force: false
      - name: Notify IndexNow
        run: curl -o /dev/null -w "%{http_code}\n" "https://api.indexnow.org/indexnow?url=https://carlosvin.github.io&key=58k0hy1db4"